# 开发环境参数。默认不启用 AI；数据库依赖仅由 Maven profile database 引入。
# 密码与 API key 从环境变量读取，不写入文件。
server:
  address: 127.0.0.1
  port: 8996

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/wechat-ai?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
      embedding: ${AI_EMBEDDING_PROVIDER:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      timeout: 30s
      max-retries: 1
      chat:
        model: ${OPENAI_MODEL:}
      embedding:
        model: ${EMBEDDING_MODEL:}

logging:
  level:
    root: INFO
    com.wechat.ai: INFO
